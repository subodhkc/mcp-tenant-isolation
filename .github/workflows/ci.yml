name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x, 24.x]
        exclude:
          # Reduce matrix size: skip some combinations
          - os: windows-latest
            node-version: 24.x
          - os: macos-latest
            node-version: 24.x
        include:
          # Node 26 canary on Linux only — allow failure, informational only
          - os: ubuntu-latest
            node-version: 26.x
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Self-scan
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        shell: bash
        run: |
          set +e
          node dist/cli/index.js scan --format sarif --output mti-results.sarif
          exit_code=$?
          set -e
          if [ $exit_code -eq 2 ]; then
            echo "::error::Scanner error during self-scan"
            exit 1
          fi
          echo "Self-scan completed with exit code $exit_code (0=no findings, 1=findings found)"

      - name: Upload SARIF
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: mti-results.sarif

  deps-check:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    # Dependabot PRs are informational — a failure here means the dependency
    # update is incompatible, not that the main branch is broken.
    # The automerge workflow waits for this job; if it fails, the PR is not merged.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - run: npm test

  publish:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install latest npm (trusted publishing requires npm >=11.5.1)
        run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - name: Publish via trusted publishing (OIDC)
        run: npm publish --provenance --access public

  publish-mcp-registry:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
